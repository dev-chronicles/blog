name: Verify

on:
  push:

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  workflow-result:
    runs-on: ubuntu-latest
    needs:
      - call-build
    if: ${{ always() && !cancelled() }}
    steps:
      - name: All steps passed
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some steps failed
        if: ${{ contains(needs.*.result, 'failure')) }}
        run: exit 1
      
